name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bats cloud-init haproxy jq shellcheck xorriso
      - name: shellcheck
        run: shellcheck -x lib.sh vm/*.sh proxy/*.sh bench/*.sh
      - name: Unit tests
        run: bats test
