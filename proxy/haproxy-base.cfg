global
    # stdout goes to the journal. /dev/log is unreachable from the chroot without rsyslog.
    log stdout format raw local0
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    maxconn 1024

defaults
    mode tcp
    log global
    option tcplog
    option tcpka
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout client-fin 30s
    timeout server-fin 30s

# Services from SERVICES in config.env follow. TCP passthrough, so TLS stays end to end.
